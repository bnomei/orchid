name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  BIN_NAME: orchid
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Verify crates.io package
        run: cargo package --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: ""
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            exe: ""
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: ""
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
            use_cross: false

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Setup cross toolchain
        if: matrix.use_cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]] && command -v cross >/dev/null 2>&1; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="${BIN_NAME}-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist"
          tar -czf "dist/${archive}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "${BIN_NAME}" \
            -C "$GITHUB_WORKSPACE" LICENSE README.md CHANGELOG.md
          (cd dist && sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256")

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "${env:BIN_NAME}-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist, $archive | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BIN_NAME}${{ matrix.exe }}" $archive
          Copy-Item README.md, LICENSE, CHANGELOG.md $archive
          Compress-Archive -Path "$archive/*" -DestinationPath "dist/$archive.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive.zip").Hash.ToLower()
          "$hash  $archive.zip" | Set-Content -NoNewline "dist/$archive.zip.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

      - name: Upload GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  container:
    name: Publish container image
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            ORCHID_VERSION=${{ steps.version.outputs.version }}
          tags: orchid-smoke:amd64

      - name: Smoke image (amd64)
        run: |
          docker run --rm --platform linux/amd64 orchid-smoke:amd64 --version
          docker run --rm --platform linux/amd64 orchid-smoke:amd64 --help

      - name: Build smoke image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          build-args: |
            ORCHID_VERSION=${{ steps.version.outputs.version }}
          tags: orchid-smoke:arm64

      - name: Smoke image (arm64)
        run: |
          docker run --rm --platform linux/arm64 orchid-smoke:arm64 --version
          docker run --rm --platform linux/arm64 orchid-smoke:arm64 --help

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ORCHID_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

  npm:
    name: Publish npm wrapper
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node
        if: env.NODE_AUTH_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: npm/orchid
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --access public

      - name: Skip npm publish
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN is not set; skipping npm publish."
