[package]
name = "orchid-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Task-file orchestration helper for coordinating scoped agent work."
readme = "README.md"
repository = "https://github.com/bnomei/orchid"
license = "MIT"
keywords = ["cli", "tasks", "orchestration", "agents"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "orchid"
path = "src/lib.rs"

[[bin]]
name = "orchid"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
